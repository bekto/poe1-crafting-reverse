name: Update prices in the repository

# Refreshes the committed public/data/prices.json (used for local development and as the fallback when the
# deploy can't reach poe.ninja). The live site gets fresh prices from the hourly deploy, so this runs daily.
on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      league:
        description: "League name as poe.ninja spells it (empty = current challenge league)"
        required: false

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch prices
        run: python3 tools/fetch_prices.py public/data/prices.json ${{ github.event.inputs.league && format('--league "{0}"', github.event.inputs.league) || '' }}
      - name: Commit if changed
        run: |
          git config user.name "prices-bot"
          git config user.email "prices-bot@users.noreply.github.com"
          git add public/data/prices.json
          git diff --cached --quiet && exit 0
          git commit -m "Update prices from poe.ninja"
          # main may have moved while the fetch ran
          git pull --rebase origin main
          git push
