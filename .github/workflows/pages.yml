name: Deploy to GitHub Pages

# Tests, fetches current prices from poe.ninja into the site (not into the repository), and publishes public/.
# Runs on every push to main and once an hour, which is as often as poe.ninja may be polled.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: node test/run.mjs
      - run: node test/unit.mjs
      - run: node test/reference.mjs
      - run: node test/perf.mjs

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Playwright and Chromium
        run: |
          npm install -g playwright
          npx playwright install --with-deps chromium
      - name: Browser checks
        run: |
          (cd public && python3 -m http.server 8765 &)
          sleep 2
          export NODE_PATH=$(npm root -g)
          node test/browser.cjs boots
          node test/browser.cjs builder
          node test/browser.cjs '#b=Metadata/Items/Rings/Ring12&i=85&w=IncreasedLife5~IncreasedLife3,ColdResist7'
          node test/a11y.cjs

  deploy:
    needs: [test, browser]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch current prices
        # keeps the committed prices.json if poe.ninja is down or has changed again
        continue-on-error: true
        run: python3 tools/fetch_prices.py public/data/prices.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v5
